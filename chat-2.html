<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Interface</title>
    <link rel="stylesheet" href="chat-2-style.css">
</head>
<body>
    <div class="chat-container">
        <!-- Chat Header -->
        <div class="chat-header">
            <div class="user-info">
                <div class="avatar">PT</div>
                <div class="user-details">
                    <h3>Fitness Programme Builder</h3>
                    <span class="status">Build the programme that suits your needs to build muscle</span>
                </div>
            </div>
            <div class="chat-actions">
                <button class="action-btn" id="clearChat">Clear</button>
            </div>
        </div>

        <!-- Error message -->
        <div id="chatError" class="chat-error"></div>

        <!-- Chat Messages Area -->
        <div class="chat-messages" class="use" id="chatMessages">
            <div class="message bot-message">
                <div class="message-avatar">PT</div>
                <div class="message-content">
                    <div class="message-text">What days of the week do you want to train on? </div>
                    <div class="message-time">12:30 PM</div>
                </div>
            </div>
        </div>

        <!-- Typing Indicator -->
        <div class="typing-indicator" id="typingIndicator" style="display: none;">
            <div class="typing-dots">
                <span></span>
                <span></span>
                <span></span>
            </div>
            <span class="typing-text">PT is typing...</span>
        </div>

        <!-- Chat Input Area -->
        <div class="chat-input-container">
            <div class="chat-input">
                <input type="text" id="messageInput" placeholder="Type your message..." autocomplete="off">
                <button class="send-btn" id="sendBtn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="22" y1="2" x2="11" y2="13"></line>
                        <polygon points="22,2 15,22 11,13 2,9"></polygon>
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <script src="chat-2-script.js"></script>
</body>
</html>
